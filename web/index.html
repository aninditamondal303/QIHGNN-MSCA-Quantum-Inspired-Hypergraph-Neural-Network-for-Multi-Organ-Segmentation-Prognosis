<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="%BASE%" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TriScan AI · Brain MRI, liver CT and cervical cell analysis in your browser</title>
    <meta name="description" content="TriScan AI analyses brain MRI, liver CT and cervical cell images in seconds, entirely in your browser: detection, outlines, measurements and a report. Nothing is uploaded." />
    <meta name="application-name" content="TriScan AI" />
    <meta name="apple-mobile-web-app-title" content="TriScan AI" />
    <meta name="theme-color" content="#0B0B0A" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TriScan AI · Medical scan analysis in your browser" />
    <meta property="og:description" content="Brain MRI, liver CT and cervical cell analysis that runs entirely in your browser. Nothing is uploaded." />
    <meta property="og:image" content="https://aninditamondal303.github.io/QIHGNN-MSCA-Quantum-Inspired-Hypergraph-Neural-Network-for-Multi-Organ-Segmentation-Prognosis/icons/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/Syne-var.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="fonts/PlusJakartaSans-var.woff" as="font" type="font/woff" crossorigin />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem('qihgnn-theme'); } catch (e) {}
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="%KATEX%" />
    <link rel="stylesheet" href="%CSS%" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript: the scan analysis runs in your browser.</noscript>
    <script type="module" src="%JS%"></script>
    %RELOAD%
  </body>
</html>

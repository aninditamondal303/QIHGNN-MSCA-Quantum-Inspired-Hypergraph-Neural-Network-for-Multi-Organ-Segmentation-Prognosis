<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="%BASE%" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QIHGNN-MSCA · Brain tumour detection, outlining and prognosis</title>
    <meta name="description" content="Upload a brain MRI and get a tumour check, an outline and a survival estimate, computed privately in your browser. Every number is measured on held-out and external data." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/Syne-var.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="fonts/PlusJakartaSans-var.woff" as="font" type="font/woff" crossorigin />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem('qihgnn-theme'); } catch (e) {}
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="%KATEX%" />
    <link rel="stylesheet" href="%CSS%" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript: the scan analysis runs in your browser.</noscript>
    <script type="module" src="%JS%"></script>
    %RELOAD%
  </body>
</html>

# Publishes the website to GitHub Pages on every push to main (Settings -> Pages -> Source: GitHub Actions).
# Scan analysis runs in the visitor's browser, so it works on Pages; only the research model's
# "Run network" button needs the Python API.
# GitHub Pages needs a public repository on a free plan.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: web
        env:
          # Pages serves the site from /<repo>/; every route and asset is resolved against this base.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          export GIT_COMMIT="${GITHUB_SHA::7}"
          npm ci --no-audit --no-fund
          npm run build
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and requirements
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml/requirements-dev.txt
      - name: Lint
        run: ruff check ml api scripts
      - name: Unit, verification, model and API tests
        run: pytest --cov --cov-report=term-missing
      - name: Numerical verification report
        working-directory: ml
        run: python -m qihgnn.verify
      - name: Smoke training run on synthetic phantoms
        working-directory: ml
        run: python -m qihgnn.train --config configs/smoke.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: web
        run: npm install
      - name: Typecheck and unit tests
        working-directory: web
        run: npm run typecheck && npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Browser end-to-end
        working-directory: web
        run: npx playwright install --with-deps chromium && npm run test:e2e

[project]
name = "qihgnn-msca"
version = "0.4.0"
description = "Quantum-inspired hypergraph network with multi-scale cross-attention for partially supervised multi-organ segmentation and prognosis."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["ml/tests", "api/tests"]
pythonpath = ["ml", "."]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["ml", "api"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E741", "B008", "B904", "B905"]

[tool.coverage.run]
source = ["ml/qihgnn", "api"]
omit = ["ml/qihgnn/train.py", "ml/qihgnn/evaluate.py", "ml/qihgnn/data/adapters.py"]
